# Pretraining the base model (scripts/pretrain_base.py).
# Model size and runtime come from configs/base.toml; this file only holds the
# training knobs. `--env smoke` swaps in the tiny [default.smoke] values below.

[default]
train_path = "data/pile_train.h5"
dev_path = "data/pile_dev.h5"
batch_size = 8              # per-GPU micro-batch
grad_accum = 12             # effective batch = batch_size * grad_accum * n_gpus
train_steps = 50000
eval_steps = 1000
eval_iters = 100
warmup_steps = 2000
optimizer = "adamw"         # "adamw" | "muon"
lr_schedule = "cosine"      # "cosine" | "wsd" | "linear"
lr = 3e-4
min_lr = 3e-5
weight_decay = 0.1
grad_clip = 1.0
out_ckpt = "models/base_pretrained.pt"
save_every = 1000

[default.smoke]
out_ckpt = "models/smoke/base_pretrained.pt"
batch_size = 4
grad_accum = 1
train_steps = 20
eval_steps = 10000
warmup_steps = 2
save_every = 10000
