<rect x="990.8" y="293.0" width="57.0" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="1019.3" y="306.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">penalty</text>
<rect x="338.1" y="373.0" width="131.0" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="403.6" y="386.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">ppo_epochs updates</text>
<text x="625.0" y="467.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6780" text-anchor="middle">Clipping keeps the new policy within a small ratio of the one that wrote the answers.</text>
