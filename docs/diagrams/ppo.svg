<text x="870.0" y="158.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">checker or reward model</text>
<rect x="774.7" y="282.5" width="190.6" height="59.0" rx="9.0" fill="#F0F2F5" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4"/>
