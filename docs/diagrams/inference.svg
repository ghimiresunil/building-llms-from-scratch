<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420" role="img" aria-label="Talking to a checkpoint">
<title>Talking to a checkpoint</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#D9E1EC"/></pattern>
<marker id="head1F2A44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A44"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FBFCFE"/>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="32.0" y="42.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="start">Talking to a checkpoint</text>
<text x="32.0" y="66.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6780" text-anchor="start">The checkpoint stores its own settings, so chat.py needs nothing but the file.</text>
<rect x="58.3" y="138.5" width="123.4" height="59.0" rx="9.0" fill="#E8F3DF" stroke="#4A7A28" stroke-width="1.4" opacity="0.75"/>
<rect x="53.3" y="143.5" width="123.4" height="59.0" rx="9.0" fill="#E8F3DF" stroke="#4A7A28" stroke-width="1.4" opacity="0.75"/>
<rect x="48.3" y="148.5" width="123.4" height="59.0" rx="9.0" fill="#E8F3DF" stroke="#4A7A28" stroke-width="1.8"/>
<text x="110.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Checkpoint</text>
<text x="110.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">weights + cfg</text>
<rect x="240.6" y="148.5" width="178.8" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="330.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Rebuild the model</text>
<text x="330.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">classic or modern</text>
<rect x="450.0" y="148.5" width="260.0" height="59.0" rx="29.5" fill="#FFFFFF" stroke="#8A96AB" stroke-width="1.8"/>
<text x="580.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Chat template</text>
<text x="580.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">your message + &lt;|assistant|&gt;</text>
<rect x="758.0" y="148.5" width="204.0" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="860.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Next-token loop</text>
<text x="860.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">temperature, top-p, top-k</text>
<rect x="751.3" y="328.5" width="217.4" height="59.0" rx="9.0" fill="#E8F3DF" stroke="#4A7A28" stroke-width="1.8"/>
<text x="860.0" y="354.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Reply</text>
<text x="860.0" y="374.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">decoded until &lt;|endoftext|&gt;</text>
<path d="M 171.7 178.0 L 240.6 178.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
