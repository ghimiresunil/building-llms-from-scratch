<path d="M 962.0 178.0 L 1040.0 178.0 L 1040.0 113.0 L 860.0 113.0 L 860.0 148.5" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<rect x="717.8" y="157.0" width="32.3" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="734.0" y="170.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">ids</text>
<rect x="843.8" y="261.0" width="32.3" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="860.0" y="274.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">ids</text>
<rect x="904.7" y="94.0" width="198.2" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="1003.8" y="107.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">append the new token, repeat</text>
<text x="400.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6780" text-anchor="middle">--raw skips the template, for a base model that only continues text.</text>
</svg>
