<path d="M 675.0 362.0 L 780.0 362.0 L 780.0 265.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 793.0 252.0 L 850.0 252.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<rect x="473.8" y="341.0" width="17.4" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="482.5" y="354.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">r</text>
<rect x="713.8" y="343.0" width="83.9" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="755.8" y="356.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">x alpha / r</text>
<text x="500.0" y="437.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6780" text-anchor="middle">--lora_rank 16: r is tiny next to d and k, so few parameters train.</text>
<text x="500.0" y="457.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6780" text-anchor="middle">At save time W becomes W + (alpha / r) B A, a normal checkpoint again.</text>
</svg>
