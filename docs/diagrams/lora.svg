<text x="130.0" y="248.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">x</text>
<text x="130.0" y="268.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">input, size k</text>
<rect x="370.0" y="112.0" width="200.0" height="80.0" rx="9.0" fill="#F0F2F5" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="470.0" y="148.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">W</text>
<text x="470.0" y="168.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">d x k, frozen</text>
<rect x="340.0" y="332.5" width="120.0" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="400.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">A</text>
<text x="400.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">r x k</text>
<rect x="505.0" y="332.5" width="170.0" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="590.0" y="358.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">B</text>
<text x="590.0" y="378.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">d x r, starts at 0</text>
<circle cx="780.0" cy="252.0" r="13" fill="#FFFFFF" stroke="#1F2A44" stroke-width="1.7"/>
<path d="M 774 252 L 786 252 M 780 246 L 780 258" stroke="#1F2A44" stroke-width="1.8"/>
<rect x="850.0" y="231.0" width="100.0" height="42.0" rx="9.0" fill="#E8F3DF" stroke="#4A7A28" stroke-width="1.8"/>
<text x="900.0" y="256.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">y</text>
