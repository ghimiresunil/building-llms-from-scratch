<path d="M 205.0 252.0 L 250.0 252.0 L 250.0 362.0 L 340.0 362.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
