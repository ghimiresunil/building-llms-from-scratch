<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400" role="img" aria-label="How to read these diagrams">
<title>How to read these diagrams</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#D9E1EC"/></pattern>
<marker id="head1F2A44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A44"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FBFCFE"/>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="32.0" y="42.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="start">How to read these diagrams</text>
<text x="32.0" y="66.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6780" text-anchor="start">Colour says what a thing is. Shape says how it is used.</text>
<rect x="22.0" y="92.5" width="176.0" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.8"/>
<text x="110.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Data</text>
<text x="110.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">text, tokens, datasets</text>
<rect x="212.0" y="92.5" width="176.0" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="300.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Computation</text>
<text x="300.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">a network or a step</text>
<rect x="402.0" y="92.5" width="176.0" height="59.0" rx="9.0" fill="#FBE6EE" stroke="#B0215A" stroke-width="1.8"/>
<text x="490.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Loss</text>
<text x="490.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">what training minimises</text>
<rect x="592.0" y="92.5" width="176.0" height="59.0" rx="9.0" fill="#FBF2D6" stroke="#A97A00" stroke-width="1.8"/>
<text x="680.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Reward</text>
<text x="680.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">scores and advantages</text>
<rect x="782.0" y="92.5" width="176.0" height="59.0" rx="9.0" fill="#F0F2F5" stroke="#6B7280" stroke-width="1.8" stroke-dasharray="6 4"/>
<text x="870.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Frozen</text>
<text x="870.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">a copy that never trains</text>
<rect x="972.0" y="92.5" width="176.0" height="59.0" rx="9.0" fill="#E8F3DF" stroke="#4A7A28" stroke-width="1.8"/>
<text x="1060.0" y="118.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Result</text>
<text x="1060.0" y="138.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">checkpoints, answers</text>
<rect x="50.0" y="222.5" width="180.0" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.4" opacity="0.75"/>
<rect x="45.0" y="227.5" width="180.0" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.4" opacity="0.75"/>
<rect x="40.0" y="232.5" width="180.0" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.8"/>
<text x="130.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Stored data</text>
<text x="130.0" y="278.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">a file on disk</text>
<rect x="270.0" y="232.5" width="180.0" height="59.0" rx="29.5" fill="#FFFFFF" stroke="#8A96AB" stroke-width="1.8"/>
<text x="360.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Small step</text>
<text x="360.0" y="278.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">one operation</text>
<rect x="500.0" y="232.5" width="180.0" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="590.0" y="258.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Ordered step</text>
<text x="590.0" y="278.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">when order matters</text>
<path d="M 760.0 262.0 L 980.0 262.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 760.0 332.0 L 980.0 332.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#head1F2A44)"/>
<circle cx="500.0" cy="232.5" r="11" fill="#1F2A44"/>
<text x="500.0" y="237.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
<rect x="831.5" y="241.0" width="77.0" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="870.0" y="254.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">(B, T, C)</text>
<text x="870.0" y="292.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">tensor shape on an arrow</text>
<text x="870.0" y="354.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">dashed: an update or a side input</text>
</svg>
