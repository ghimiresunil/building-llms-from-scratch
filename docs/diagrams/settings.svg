<text x="240.0" y="340.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6780" text-anchor="middle">your tweaks, git-ignored</text>
