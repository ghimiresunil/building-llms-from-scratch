<text x="240.0" y="216.2" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#5B6780" text-anchor="middle">that stage&#x27;s settings</text>
<rect x="90.0" y="234.5" width="300.0" height="57.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.8"/>
