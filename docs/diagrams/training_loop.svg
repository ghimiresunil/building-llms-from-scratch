<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="490" viewBox="0 0 1140 490" role="img" aria-label="The pretraining loop">
<title>The pretraining loop</title>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#D9E1EC"/></pattern>
<marker id="head1F2A44" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1F2A44"/></marker>
<marker id="head2B7A76" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2B7A76"/></marker>
</defs>
<rect width="100%" height="100%" fill="#FBFCFE"/>
<rect width="100%" height="100%" fill="url(#dots)"/>
<text x="32.0" y="42.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2A44" text-anchor="start">The pretraining loop</text>
<text x="32.0" y="66.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6780" text-anchor="start">Predict every next token, measure the miss, nudge the weights. Repeat for train_steps.</text>
<rect x="41.4" y="138.5" width="177.1" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.4" opacity="0.75"/>
<rect x="36.4" y="143.5" width="177.1" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.4" opacity="0.75"/>
<rect x="31.4" y="148.5" width="177.1" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.8"/>
<text x="120.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Token file</text>
<text x="120.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">one long array of ids</text>
<rect x="264.8" y="148.5" width="170.4" height="59.0" rx="9.0" fill="#E2F3F1" stroke="#2B7A76" stroke-width="1.8"/>
<text x="350.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Random windows</text>
<text x="350.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">batch_size x context</text>
<rect x="545.8" y="148.5" width="128.4" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="610.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Transformer</text>
<text x="610.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">forward pass</text>
<rect x="824.9" y="148.5" width="150.2" height="59.0" rx="9.0" fill="#FBE6EE" stroke="#B0215A" stroke-width="1.8"/>
<text x="900.0" y="174.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Cross-entropy</text>
<text x="900.0" y="194.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">vs the next token</text>
<rect x="810.0" y="338.5" width="180.0" height="59.0" rx="29.5" fill="#FFFFFF" stroke="#8A96AB" stroke-width="1.8"/>
<text x="900.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Backward</text>
<text x="900.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">loss.backward()</text>
<rect x="533.2" y="338.5" width="153.6" height="59.0" rx="9.0" fill="#E8EDFC" stroke="#3352C2" stroke-width="1.8"/>
<text x="610.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Optimizer step</text>
<text x="610.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">AdamW or Muon</text>
<rect x="250.0" y="338.5" width="200.0" height="59.0" rx="29.5" fill="#FFFFFF" stroke="#8A96AB" stroke-width="1.8"/>
<text x="350.0" y="364.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#1F2A44" text-anchor="middle">Learning rate</text>
<text x="350.0" y="384.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">warmup, then decay</text>
<path d="M 208.6 178.0 L 264.8 178.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 435.2 178.0 L 545.8 178.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 674.2 178.0 L 824.9 178.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 350.0 148.0 L 350.0 118.0 L 900.0 118.0 L 900.0 148.0" fill="none" stroke="#2B7A76" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#head2B7A76)"/>
<path d="M 900.0 207.5 L 900.0 338.5" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 810.0 368.0 L 686.8 368.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 450.0 368.0 L 533.2 368.0" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" marker-end="url(#head1F2A44)"/>
<path d="M 610.0 338.5 L 610.0 207.5" fill="none" stroke="#1F2A44" stroke-width="1.7" stroke-linejoin="round" stroke-dasharray="5 4" marker-end="url(#head1F2A44)"/>
<rect x="463.2" y="157.0" width="54.6" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="490.5" y="170.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">(B, T)</text>
<rect x="685.0" y="157.0" width="129.0" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="749.5" y="170.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">(B, T, V) logits</text>
<rect x="474.9" y="99.0" width="300.2" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="625.0" y="112.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">targets: the same window shifted by one</text>
<rect x="857.8" y="266.0" width="84.4" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="900.0" y="279.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">one number</text>
<rect x="709.9" y="347.0" width="77.0" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="748.4" y="360.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">gradients</text>
<rect x="564.1" y="266.0" width="91.8" height="19" rx="3" fill="#FBFCFE" opacity="0.95"/><text x="610.0" y="279.0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="12" font-weight="400" fill="#5B6780" text-anchor="middle">new weights</text>
<text x="610.0" y="458.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#5B6780" text-anchor="middle">Every eval_steps, the same loss on the dev file tells you if the model generalises.</text>
</svg>
