[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "building-llms-from-scratch"
version = "0.4.0"
description = "Build and train an LLM from scratch in plain PyTorch: pretraining, SFT, reward modeling, PPO, DPO and GRPO, on a GPU or a laptop CPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sunil Ghimire" }]
keywords = ["llm", "transformer", "pytorch", "rlhf", "dpo", "grpo", "distillation", "yarn", "paged-attention", "education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Intended Audience :: Education",
]
# Core deps for the model + data path. torch comes from PyPI: on Linux that wheel ships CUDA,
# on Windows and macOS it is the CPU / MPS build. The README explains how to get a CPU-only
# build on Linux if you don't have an NVIDIA GPU.
dependencies = [
    "torch>=2.3",
    "numpy",
    "h5py",
    "tqdm",
    "tiktoken",
    "zstandard",
    "requests",
    "jaxtyping>=0.2.28",
    "regex",
    "tomli>=2; python_version < '3.11'",  # reads TOML on Python 3.10 (3.11+ has tomllib)
    "dynaconf>=3.2",   # layered TOML settings: configs/*.toml + *.local.toml + BLFS_* env vars + .env
]

[project.urls]
Homepage = "https://github.com/ghimiresunil/building-llms-from-scratch"
Repository = "https://github.com/ghimiresunil/building-llms-from-scratch"
Documentation = "https://ghimiresunil.github.io/building-llms-from-scratch/"
Issues = "https://github.com/ghimiresunil/building-llms-from-scratch/issues"
Changelog = "https://github.com/ghimiresunil/building-llms-from-scratch/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Post-training extras (datasets + optional experiment logging): `uv sync --extra train`
train = ["datasets", "wandb"]
# The MkDocs Material documentation site: `uv sync --extra docs`
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pymdown-extensions"]
# Everything (pip users; with uv, `uv sync --all-extras` does the same).
all = ["datasets", "wandb", "mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "pymdown-extensions"]

[dependency-groups]
# Tests, linting and type checking. `uv sync` installs this group by default.
dev = [
    "pytest>=8",
    "beartype>=0.18",
    "ruff>=0.6",
    "mypy>=1.10",
    "matplotlib",
    "pre-commit>=3",
]

[tool.uv]
# `uv sync` gives you the package (editable) plus the dev tools in .venv/.
default-groups = ["dev"]

[tool.setuptools]
packages = [
    "config",
    "data_loader",
    "src",
    "src.curation",
    "src.decorators",
    "src.inference",
    "src.models",
    "src.models.modern",
    "src.optim",
    "src.post_training",
    "src.post_training.rewards",
    "src.tokenizer",
]

[tool.setuptools.package-data]
# ship the type-checking markers alongside the packages
"*" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["slow: end-to-end runs of the training scripts (deselect with -m 'not slow')"]
filterwarnings = ["ignore::DeprecationWarning:torch.*"]

[tool.ruff]
line-length = 88   # matches the ruff hooks in .pre-commit-config.yaml
target-version = "py310"
# Root-level folders only: a bare "models" would also skip src/models/. Markdown is left alone so
# code samples in the docs keep their hand alignment.
extend-exclude = ["*.ipynb", "*.md", "./data", "./models", "./logs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP", "I"]
ignore = [
    "E702",  # the trainers keep short `a; b` bookkeeping on one line
    "E731",  # small lambdas are clearer than defs in a few places
    "E741",  # `l` is a natural name in math code
    "B905",  # zip(strict=...) would change behavior on a length mismatch
    "F722",  # jaxtyping shape strings such as "batch seq" are not forward references
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]  # scripts put the repo root on sys.path before importing it

[tool.ruff.lint.isort]
known-first-party = ["config", "data_loader", "scripts", "src"]

[tool.mypy]
python_version = "3.10"
files = ["src", "config", "data_loader"]
ignore_missing_imports = true
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_equality = true  # comparing a Literal config field with a misspelled value is an error

# These modules are fully annotated; keep it that way.
[[tool.mypy.overrides]]
module = [
    "config.settings",
    "src.decorators",
    "src.decorators.logging_service",
    "src.checkpoint",
    "src.curation.*",
    "src.device",
    "src.inference.*",
    "src.models.factory",
    "src.models.lora",
    "src.models.modern.*",
    "src.optim.*",
    "src.post_training.distill",
    "src.post_training.test_time",
    "src.tokenizer.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
