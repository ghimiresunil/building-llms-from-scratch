# Install once per clone (sets up the commit and commit-message hooks together):
#   uv sync && uv run pre-commit install
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
        name: Check for added large files
        description: Prevent giant files from being committed
        entry: check-added-large-files
        args: [--maxkb=500]
        exclude: ^uv\.lock$ # the lockfile is ~1.1 MB and must be committed

      - id: check-ast
        name: Check Python AST
        description: Check whether the files parse as valid Python
        entry: check-ast
        types: [python]

      - id: check-case-conflict
        name: Check for case conflicts
        description: Check for files that would conflict due to filename case differences
        entry: check-case-conflict

      - id: check-merge-conflict
        name: Check for merge conflicts
        description: Check for files that contain merge conflict strings
        entry: check-merge-conflict
        types: [text]

      - id: debug-statements
        name: Debug statements (Python)
        description: Check for debugger imports and `breakpoint()` calls
        entry: debug-statement-hook
        types: [python]

      - id: end-of-file-fixer
        name: Fix end of files
        description: Ensures that a file ends with a newline
        entry: end-of-file-fixer
        types: [text]
        exclude: \.py$ # Excludes all Python files
        stages: [pre-commit, pre-push, manual]

      - id: mixed-line-ending
        name: Mixed line ending
        description: Replaces or checks mixed line endings
        entry: mixed-line-ending
        args: [--fix=lf]
        types: [text]

      - id: no-commit-to-branch
        name: Don't commit to branch
        description: Prevent commits to protected branches (e.g. `main`)
        entry: no-commit-to-branch
        args: [--branch=main, --branch=master]
        pass_filenames: false
        always_run: true

      - id: trailing-whitespace
        name: Trim trailing whitespace
        description: Trims trailing whitespace
        entry: trailing-whitespace-fixer
        types: [text]
        stages: [pre-commit, pre-push, manual]

      - id: check-yaml
        name: Check YAML files
        description: Validate YAML syntax
        entry: check-yaml
        args: [--unsafe]

      - id: check-json
        name: Check JSON files
        description: Validate JSON syntax
        entry: check-json

      - id: check-toml
        name: Check TOML files
        description: Validate TOML syntax
        entry: check-toml

      - id: detect-private-key
        name: Detect private key
        description: Detects accidental commits of private keys
        entry: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.7.15
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.0
    hooks:
      - id: ruff
        name: Ruff Linter

        exclude: ^tests/
        types_or: [python, pyi]
        args:
          - --fix
          - --exit-non-zero-on-fix
          - --ignore=D212,E501
          - --line-length=88 # Add this
      - id: ruff-format
        exclude: ^(tests/|comparision/)
        name: Ruff Formatter
        types_or: [python, pyi]
        args: [--line-length=88]

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.2.0
    hooks:
      - id: conventional-pre-commit
        name: Git Conventional Commit Message
        stages: [commit-msg]
        args:
          [
            --strict,
            --force-scope,
            --verbose,
            feat,
            fix,
            chore,
            refactor,
            docs,
            style,
            test,
            perf,
            ci,
            build,
            revert,
          ]
